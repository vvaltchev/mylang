name: MacOSX
on: [pull_request, push, workflow_dispatch]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      # libc++ hardening (macOS uses libc++): bounds-checks std containers, the
      # libc++ analog of -D_GLIBCXX_ASSERTIONS. EXTENSIVE = the broad,
      # low-overhead mode (LLVM 17+; macos-latest has it).
      # VM_HARDENING=ON: the heavy per-op VM checks (frame-slot bounds + operand
      # type tags) - on here explicitly (a Debug build enables them by default,
      # but pin it so a config change can't silently drop them).
      run: cmake -DTESTS=1 -DVM_HARDENING=ON $GITHUB_WORKSPACE
           -DCMAKE_BUILD_TYPE=$BUILD_TYPE
           -DCMAKE_CXX_FLAGS="-D_LIBCPP_HARDENING_MODE=_LIBCPP_HARDENING_MODE_EXTENSIVE"

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run:  ./mylang -rt
