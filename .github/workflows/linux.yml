name: Linux
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        bt: [Debug, Release]
        cxx: [g++, clang++]

    env:
      BUILD_TYPE: ${{ matrix.bt }}
      CXX: ${{ matrix.cxx }}

    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    # VM_HARDENING=ON turns on the HEAVY per-op VM checks (frame-slot bounds +
    # operand type tags, ML_VM_CHECK) even in the Release lane - a CI release
    # runs with far more safety than a local one, so a layout-dependent VM UB
    # (a bad slot index reading a garbage LValue) fails as a LOUD, located
    # assertion instead of a mystery segfault. See defs.h / CLAUDE.md.
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DVM_HARDENING=ON $GITHUB_WORKSPACE
           -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    # Enable core dumps into the build dir before running, so a crash (the rare
    # layout-dependent VM heisenbug) leaves a core we can inspect + download.
    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        ulimit -c unlimited
        echo "${{github.workspace}}/build/core.%e.%p" \
          | sudo tee /proc/sys/kernel/core_pattern
        ./mylang -rt

    # docs/myv-format.txt is the .myv SPECIFICATION, not a description of it -
    # a third party must be able to write a reader from it alone. This script
    # is that reader: written from the DOCUMENT and deliberately not from
    # serialize.cpp, so consuming every image to exactly EOF is what proves
    # the doc complete. It drifted three versions unnoticed once (the doc said
    # v10 while the format was at v13); running it here is what stops that
    # recurring. Stdlib-only Python, no deps.
    - name: Docs - the .myv spec still describes the format
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        mkdir -p myvdoc
        for f in $GITHUB_WORKSPACE/samples/* $GITHUB_WORKSPACE/bench/my/*.my; do
          ./mylang -c "$f" -o "myvdoc/$(basename "$f" .my).myv"
        done
        python3 $GITHUB_WORKSPACE/tests/myv_doc_check.py myvdoc/*.myv

    # `-rt` runs IN-PROCESS: it calls lexer/parser/infer/resolve directly and
    # never goes through the CLI's argument handling, so a flag wired to the
    # wrong side of an `if` is invisible to every one of its tests. That is
    # how `-nr` came to skip run_optimizers - exiting 0 in silence on a
    # program a plain run refuses - with the whole suite green (#147).
    - name: Driver - the CLI flags do what they say
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: $GITHUB_WORKSPACE/tests/driver_checks.sh ./mylang

    # On a crash: print a full backtrace from the core (immediately visible in
    # the log) and upload the core + the exact binary as an artifact, so the
    # failure can be debugged offline without re-reproducing it.
    - name: Backtrace on crash
      if: failure()
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        sudo apt-get update >/dev/null 2>&1 || true
        sudo apt-get install -y gdb >/dev/null 2>&1 || true
        shopt -s nullglob
        cores=(core.*)
        if [ ${#cores[@]} -eq 0 ]; then
          echo "(no core file produced)"
          exit 0
        fi
        for c in "${cores[@]}"; do
          echo "===== gdb backtrace for $c ====="
          gdb -batch -ex "thread apply all bt full" ./mylang "$c" 2>&1 \
            | head -300
        done

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: crash-${{ matrix.bt }}-${{ matrix.cxx }}
        path: |
          ${{github.workspace}}/build/core.*
          ${{github.workspace}}/build/mylang
        if-no-files-found: ignore

  # Adversarial allocator lane: forces AST-node address reuse (RECYCLE=ON) so
  # "pointer used as a stable identity" bugs surface deterministically under
  # -rt. Debug build, so it also runs the full sanitizer + assertion net
  # (VM_HARDENING defaults ON for a Debug build).
  recycle:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake (RECYCLE)
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DRECYCLE=ON -DVM_HARDENING=ON
           -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build .

    - name: Test
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        ulimit -c unlimited
        echo "${{github.workspace}}/build/core.%e.%p" \
          | sudo tee /proc/sys/kernel/core_pattern
        ./mylang -rt

    - name: Backtrace on crash
      if: failure()
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        sudo apt-get update >/dev/null 2>&1 || true
        sudo apt-get install -y gdb >/dev/null 2>&1 || true
        shopt -s nullglob
        cores=(core.*)
        if [ ${#cores[@]} -eq 0 ]; then
          echo "(no core file produced)"
          exit 0
        fi
        for c in "${cores[@]}"; do
          echo "===== gdb backtrace for $c ====="
          gdb -batch -ex "thread apply all bt full" ./mylang "$c" 2>&1 \
            | head -300
        done

    - name: Upload crash artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: crash-recycle
        path: |
          ${{github.workspace}}/build/core.*
          ${{github.workspace}}/build/mylang
        if-no-files-found: ignore

  # The RELEASE binaries a USER actually ships have NO -rt suite (it is
  # compiled in only under TESTS=1), so until this NOTHING in CI proved they
  # run correctly - the whole matrix above is TESTS=1. Two configs: the
  # default release (ASSERTS=1) and the bare one (ASSERTS=0). Deliberately
  # shallow - build them and run actual scripts at the minimum size
  # (system_smoke.py: the bench pairs vs CPython through both engines, plus
  # the self-asserting functional tests). Coverage stays the TESTS lanes'
  # job; this only answers "does the shipped binary work at all". A plain
  # no-TESTS build ALSO catches a declaration that escaped a TESTS guard -
  # exactly the bug that broke `make` with no flags once (the norec decls).
  release-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        asserts: [ON, OFF]
    steps:
    - uses: actions/checkout@v4

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake (Release, TESTS=0, ASSERTS=${{ matrix.asserts }})
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=0 -DASSERTS=${{ matrix.asserts }}
           -DCMAKE_BUILD_TYPE=Release $GITHUB_WORKSPACE

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config Release

    # Confirm the binary IS the config we meant to test (`-v` reads
    # compiler-set macros, so it cannot drift): tests=0, and asserts matching
    # the matrix. A silent misconfigure would make the smoke test vacuous.
    - name: Confirm the build config
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: |
        ./mylang -v
        want=$([ "${{ matrix.asserts }}" = "ON" ] && echo 1 || echo 0)
        ./mylang -v | grep -q "tests             0" \
          || { echo "expected tests=0"; exit 1; }
        ./mylang -v | grep -q "asserts           $want" \
          || { echo "expected asserts=$want"; exit 1; }

    - name: System smoke - actual scripts at scale 1
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: python3 $GITHUB_WORKSPACE/tests/system_smoke.py ./mylang

  # ⛔ THE NON-LTO LANE. LTO defaults to OPT, so every optimized build in
  # every other lane - and every local `make -j` - is an LTO build, and
  # `LTO=0` (documented in CLAUDE.md as the way to get a faster/debuggable
  # link) was compiled by NOBODY. It had been BROKEN for a day before anyone
  # tried it.
  #
  # This is not a packaging nicety. GCC's `-Wclobbered` needs the ordinary
  # per-TU pipeline to see a whole function at compile time, so an LTO build
  # is SILENT about it - and the thing it was silent about was real
  # undefined behaviour: `jit_str_probe_verify` read a non-volatile local
  # after `siglongjmp`, which C17 7.13.2.1p3 leaves INDETERMINATE. Had that
  # register come back non-zero, the probe would have reported success after
  # faulting and the JIT would have baked a std::string layout the toolchain
  # does not have.
  #
  # So the lane's real job is to run the DIAGNOSTICS that only exist without
  # LTO. Both compilers, because their warning sets differ.
  lto0:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
    - uses: actions/checkout@v4

    - name: Build (Makefile, OPT=1 TESTS=1 LTO=0)
      shell: bash
      run: make -j OPT=1 TESTS=1 LTO=0 CXX=${{ matrix.cxx }}
           BUILD_DIR=build-lto0

    # Prove the lane tested what it claims. `-v` reads COMPILER-SET macros,
    # so it cannot drift from what was compiled - without this check a
    # future change to the LTO default would leave this job building WITH
    # LTO and passing while proving nothing.
    - name: Confirm LTO is actually off
      shell: bash
      run: |
        ./build-lto0/mylang -v
        ./build-lto0/mylang -v | grep -qE "^  lto +0" \
          || { echo "FAIL: this lane did not build with LTO off"; exit 1; }
        ./build-lto0/mylang -v | grep -qE "^  opt +1" \
          || { echo "FAIL: -Wclobbered needs an optimized build"; exit 1; }

    - name: Test
      shell: bash
      run: ./build-lto0/mylang -rt

    - name: Driver - the CLI flags do what they say
      shell: bash
      run: tests/driver_checks.sh ./build-lto0/mylang

    # A no-TESTS, assert-free build is the shape a user ships, and is also
    # where a declaration that escaped a TESTS guard shows up.
    - name: Build the shipping shape too (OPT=1 ASSERTS=0 LTO=0)
      shell: bash
      run: |
        make -j OPT=1 ASSERTS=0 TESTS=0 LTO=0 CXX=${{ matrix.cxx }} \
             BUILD_DIR=build-lto0-ship
        ./build-lto0-ship/mylang -v
        python3 tests/system_smoke.py ./build-lto0-ship/mylang

    # The other build system has its own LTO knob; a fix to one must not
    # leave the other broken. CMake is also what CI runs everywhere else,
    # and `make` alone has passed configurations it breaks before.
    - name: CMake with -DLTO=OFF
      shell: bash
      run: |
        cmake -E make_directory cmb-lto0
        cd cmb-lto0
        cmake -DTESTS=1 -DLTO=OFF -DCMAKE_BUILD_TYPE=Release \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} $GITHUB_WORKSPACE
        cmake --build . --config Release
        ./mylang -v
        ./mylang -v | grep -qE "^  lto +0" \
          || { echo "FAIL: CMake -DLTO=OFF did not disable LTO"; exit 1; }
        ./mylang -rt

  # DEBUG_INFO=1 (2026-08-26): debug info is OFF by default in BOTH build
  # systems (the binary was huge and the info unused in most builds - disk
  # wear); this lane keeps the =1 configuration building and green so it
  # cannot rot. The vacuity guard checks BOTH directions on the actual ELF
  # (.debug_info present with the flag, absent without it) - `-v` cannot
  # self-report this one, since no compiler macro tracks -g.
  dbginfo:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [g++, clang++]
    steps:
    - uses: actions/checkout@v4

    - name: Build (Makefile, DEBUG_INFO=1 TESTS=1 OPT=0)
      shell: bash
      run: make -j DEBUG_INFO=1 TESTS=1 OPT=0 CXX=${{ matrix.cxx }}
           BUILD_DIR=build-dbginfo

    - name: Confirm debug info is actually present
      shell: bash
      run: |
        readelf -S build-dbginfo/mylang | grep -q "\.debug_info" \
          || { echo "FAIL: DEBUG_INFO=1 built without debug info"; exit 1; }

    - name: Test
      shell: bash
      run: ./build-dbginfo/mylang -rt

    - name: Confirm the DEFAULT build has NO debug info
      shell: bash
      run: |
        make -j TESTS=0 OPT=1 CXX=${{ matrix.cxx }} BUILD_DIR=build-nodbg
        if readelf -S build-nodbg/mylang | grep -q "\.debug_info"; then
          echo "FAIL: the default build still carries debug info"; exit 1
        fi

    # The other build system's knob; CMake's per-config defaults inject
    # -g on their own, which is exactly what the OFF default strips.
    - name: CMake with -DDEBUG_INFO=ON (and the OFF default checked)
      shell: bash
      run: |
        cmake -E make_directory cmb-dbginfo
        cd cmb-dbginfo
        cmake -DTESTS=1 -DDEBUG_INFO=ON -DCMAKE_BUILD_TYPE=Debug \
              -DASAN=OFF -DUBSAN=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} $GITHUB_WORKSPACE
        cmake --build . -j
        readelf -S mylang | grep -q "\.debug_info" \
          || { echo "FAIL: -DDEBUG_INFO=ON built without debug info"; exit 1; }
        cd ..
        cmake -E make_directory cmb-nodbg
        cd cmb-nodbg
        cmake -DTESTS=1 -DCMAKE_BUILD_TYPE=Debug -DASAN=OFF -DUBSAN=OFF \
              -DCMAKE_CXX_COMPILER=${{ matrix.cxx }} $GITHUB_WORKSPACE
        cmake --build . -j
        if readelf -S mylang | grep -q "\.debug_info"; then
          echo "FAIL: the CMake Debug default still injects -g"; exit 1
        fi
