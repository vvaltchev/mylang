# The NETS lane - the correctness tools that were never wired into CI.
#
# Until now CI ran `-rt`, driver_checks.sh and myv_doc_check.py and
# nothing else, so the project's differential corpus and all four
# fuzzers only ever ran when someone remembered to run them by hand.
# That is not theoretical: corpus_diff caught a JIT abort (a mixed-kind
# call chain tripping jit_ret_audit) that `-rt` passed straight through,
# and the Net 3 enumeration caught a ref_slots leak that BOTH missed.
#
# These are slower than the -rt lanes by design; they run in parallel
# with them, not in front of them, so a fast `-rt` failure still
# reports quickly.
name: Nets

on: [pull_request, push, workflow_dispatch]

jobs:
  # ---------------------------------------------------------------- #
  # The engine differential + the no-record tier's nets 2 and 3.
  # Debug, so ASan + UBSan + VM_HARDENING are all live: the enumeration
  # deliberately drives exception unwinds through mixed frame kinds,
  # which is exactly where a sanitizer finding is worth having.
  # ---------------------------------------------------------------- #
  differential:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
           $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    # tree-walker vs the default engine over tests/functional + samples
    - name: corpus_diff
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang

    # ⛔ IS THE DISASSEMBLER TELLING THE TRUTH? Every instruction the
    # JIT emits, cross-checked against objdump - boundaries AND
    # mnemonics. This is the only net that can catch a CONFIDENTLY
    # WRONG decode; `DUMP IS UNRELIABLE` and the -rt coverage check both
    # only catch bytes we KNOW we failed on. It found two missing F7
    # sub-opcodes (neg, imul) that printed a silent `f7/?` placeholder
    # on 284 corpus sites. --matrix sweeps both arenas, every pin-pool
    # rotation and a range of pin budgets, because those change WHICH
    # encodings get emitted.
    - name: "disasm: every emitted instruction agrees with objdump"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/scripts/disasmcheck.py ./mylang --matrix

    # the same corpus with each JIT lever forced off, one at a time
    - name: corpus_diff --levers
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang --levers

    # Net 3: every program in a bounded shape space, four engines,
    # compared byte-for-byte. Depth 3 here (480 programs); the full
    # depth-4 space (2272) is a manual run.
    - name: "Net 3: small-scope enumeration (depth 3)"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/norec_enum.py ./mylang
           --depth 3 --reach 0

    # Net 2: force a frame reconstruction at the Nth call event, one
    # process per N, in shadow AND production.
    - name: "Net 2: deterministic event sweep"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/norec_sweep.py ./mylang
           --max-events 25

    # random deep-nested programs against a CPython twin, all engines
    - name: nested_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/nested_fuzz.py
           --mylang ./mylang --count 250

  # ---------------------------------------------------------------- #
  # The .myv corruption fuzzer, on BOTH build types on purpose:
  # CLAUDE.md records that a sanitizer build and an assert-free release
  # catch DIFFERENT things here - the debug one finds the memory error,
  # the release one finds the case where a check the debug build relies
  # on has been compiled away.
  # ---------------------------------------------------------------- #
  # ---------------------------------------------------------------- #
  # THE NO-ARENA CONFIGURATION - the JIT with its type tags in
  # REGISTERS instead of imm32.
  #
  # lowmem.h places the Type singletons below 2^31 so a tag store is
  # `mov qword [rbx+d], imm32`. Where that mapping is unavailable -
  # Darwin, Windows, a hardened kernel, an exhausted low 2GB, A FAILED
  # MAP_32BIT ON AN ORDINARY LINUX BOX - store_type_tag and cmp_reg_tag
  # emit a register form instead, and jit_xcache_busy then denies r8 to
  # the pin pool. Materially different emitted code, and it SHIPS.
  #
  # Until MYLANG_NO_LOWMEM existed no build and no lane could enter it,
  # because the arena is an mmap at static init with no switch. That is
  # the lto0 shape: a configuration only one platform can take is a
  # configuration nobody tests. Its first run found a shipped wrong
  # answer - store_dst_bool naming a register for the t_bool tag whose
  # `movabs` had been deleted when the imm32 form landed - with `-rt`
  # 1922/1922 and plain corpus_diff 20/20 throughout.
  #
  # TWO BUILDS, because they catch different things (the myv-fuzz job's
  # reasoning, same file) - and that is MEASURED here, not assumed.
  # Reintroducing the store_dst_bool defect and running `-rt` off-arena
  # in each:
  #     debug-sanitized     rc=134, an ABORT with a located UBSan
  #                         report naming the bad Type access
  #     release-no-asserts  rc=139, a SEGFAULT - the ML_CHECK tripwires
  #                         are compiled away, so the defect arrives as
  #                         the raw crash a user would get, in the build
  #                         configuration a shipped program runs under
  # Neither is redundant: the first says WHERE, the second proves the
  # failure survives without the assertion net holding it up.
  # ---------------------------------------------------------------- #
  nolowmem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-sanitized
            cmake: -DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
          - name: release-no-asserts
            cmake: -DTESTS=1 -DASSERTS=OFF -DCMAKE_BUILD_TYPE=Release
    name: nolowmem (${{matrix.name}})
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake ${{matrix.cmake}} $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    # ⛔ THE VACUITY GUARD, FIRST. A lane that tests a configuration
    # must PROVE it is in that configuration, or it passes green doing
    # nothing the day a default moves - which is exactly why the lto0
    # lane asserts `lto 0` before it tests anything. Both directions, so
    # neither a stuck-on nor a stuck-off answer gets through.
    - name: "assert the arena is refused (and reported)"
      working-directory: ${{github.workspace}}/build
      run: |
        ./mylang -v | grep -E '^  lowmem +1' \
          || { echo "expected the arena ON by default"; exit 1; }
        MYLANG_NO_LOWMEM=1 ./mylang -v | grep -E '^  lowmem +0' \
          || { echo "MYLANG_NO_LOWMEM=1 did not refuse it"; exit 1; }

    - name: "-rt with the arena refused"
      working-directory: ${{github.workspace}}/build
      run: MYLANG_NO_LOWMEM=1 ./mylang -rt

    # the engine differential in the same configuration: the tree-walker
    # has no JIT, so this is tw vs the register-form emission
    - name: corpus_diff --nolowmem
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang --nolowmem

    - name: driver_checks
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/driver_checks.sh ./mylang

  myv-fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-asan
            flags: "-DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug"
          - name: release-noassert
            flags: "-DTESTS=1 -DASSERTS=OFF -DCMAKE_BUILD_TYPE=Release"
    name: "myv-fuzz (${{ matrix.name }})"
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake ${{ matrix.flags }} $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    - name: myv_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/myv_fuzz.py ./mylang -n 400
           --save $GITHUB_WORKSPACE/myv-fuzz-bad

    # a finding cannot be regenerated from a seed - an image embeds its
    # source path - so keep it
    - name: Upload findings
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: myv-fuzz-bad-${{ matrix.name }}
        path: myv-fuzz-bad/
        if-no-files-found: ignore

  # ---------------------------------------------------------------- #
  # The REPL fuzzer under RECYCLE=1 + ASan, which is the combination
  # CLAUDE.md names for this: the REPL RETAINS its input ASTs, so it is
  # where a stale-node identity bug would live, and the recycling
  # allocator is what makes that class deterministic.
  # ---------------------------------------------------------------- #
  repl-fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DRECYCLE=ON -DVM_HARDENING=ON
           -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j
    - name: repl_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/repl_fuzz.py ./mylang -n 400
           --save $GITHUB_WORKSPACE/repl-fuzz-bad
    - name: Upload findings
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: repl-fuzz-bad
        path: repl-fuzz-bad/
        if-no-files-found: ignore

  # ---------------------------------------------------------------- #
  # Net 4: the coverage RATCHET over the no-record tier's walk and
  # reconstruction surface.
  #
  # The floors below are NOT the goal - the goal is 100% (--gate), and
  # docs/jit-optimizations.md's Net 4 entry records what is still
  # uncovered and why. They exist so the surface can only improve: a
  # plain `-rt` alone measures 54.8%/47.0% here, so a change that
  # stopped the shadow workload from running would fall straight
  # through these floors even though the absolute target is ahead.
  # ---------------------------------------------------------------- #
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DGCOV=1 -DVM_HARDENING=ON
           -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j
    - name: "Net 4: no-record coverage ratchet"
      run: python3 $GITHUB_WORKSPACE/tests/norec_coverage.py
           --build-dir ${{github.workspace}}/build --run
           --min-lines 70 --min-branches 55
