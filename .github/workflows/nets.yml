# The NETS lane - the correctness tools that were never wired into CI.
#
# Until now CI ran `-rt`, driver_checks.sh and myv_doc_check.py and
# nothing else, so the project's differential corpus and all four
# fuzzers only ever ran when someone remembered to run them by hand.
# That is not theoretical: corpus_diff caught a JIT abort (a mixed-kind
# call chain tripping jit_ret_audit) that `-rt` passed straight through,
# and the Net 3 enumeration caught a ref_slots leak that BOTH missed.
#
# These are slower than the -rt lanes by design; they run in parallel
# with them, not in front of them, so a fast `-rt` failure still
# reports quickly.
name: Nets

on: [pull_request, push, workflow_dispatch]

jobs:
  # ---------------------------------------------------------------- #
  # The engine differential + the no-record tier's nets 2 and 3.
  # Debug, so ASan + UBSan + VM_HARDENING are all live: the enumeration
  # deliberately drives exception unwinds through mixed frame kinds,
  # which is exactly where a sanitizer finding is worth having.
  # ---------------------------------------------------------------- #
  differential:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
           $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    # tree-walker vs the default engine over tests/functional + samples
    - name: corpus_diff
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang

    # ⛔ IS THE DISASSEMBLER TELLING THE TRUTH? Every instruction the
    # JIT emits, cross-checked against objdump - boundaries AND
    # mnemonics. This is the only net that can catch a CONFIDENTLY
    # WRONG decode; `DUMP IS UNRELIABLE` and the -rt coverage check both
    # only catch bytes we KNOW we failed on. It found two missing F7
    # sub-opcodes (neg, imul) that printed a silent `f7/?` placeholder
    # on 284 corpus sites. --matrix sweeps both arenas, every pin-pool
    # rotation and a range of pin budgets, because those change WHICH
    # encodings get emitted.
    - name: "disasm: every emitted instruction agrees with objdump"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/scripts/disasmcheck.py ./mylang --matrix

    # ⛔ AND IS IT REPRODUCIBLE? vdjcmp.sh's SELF-TEST - one binary
    # against ITSELF over the whole corpus - is what makes every
    # "emitted code byte-identical" claim mean anything, and until
    # 2026-08-27 it ran ONLY when someone remembered to. It did not go
    # wrong quietly: from the day #97 step 1a added the absolute-disp32
    # operand (whose raw address reached the text) it FAILED on every
    # invocation and refused to compare. Nobody invoked it.
    #
    # A SELF-TEST THAT IS NOT IN CI IS NOT A NET. The whole point of
    # one is that it fires without being asked.
    - name: "vdjcmp self-test: -vdj is reproducible"
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/scripts/vdjcmp.sh ./mylang ./mylang

    # the same corpus with each JIT lever forced off, one at a time
    - name: corpus_diff --levers
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang --levers

    # #38 repro B: with inlining ON, every CLI configuration (the JIT
    # levers, the splice off, a .myv image, --no-opt all) must render
    # the backtrace and caret `-ni -tw` renders. An engine differential
    # cannot see a frame the inliner loses: it is lost in every engine.
    - name: "bt_oracle: inlining never changes a backtrace"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/bt_oracle.py ./mylang

    # Net 3: every program in a bounded shape space, four engines,
    # compared byte-for-byte. Depth 3 here (480 programs); the full
    # depth-4 space (2272) is a manual run.
    - name: "Net 3: small-scope enumeration (depth 3)"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/norec_enum.py ./mylang
           --depth 3 --reach 0

    # Net 2: force a frame reconstruction at the Nth call event, one
    # process per N, in shadow AND production.
    - name: "Net 2: deterministic event sweep"
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/norec_sweep.py ./mylang
           --max-events 25

    # random deep-nested programs against a CPython twin, all engines
    - name: nested_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/nested_fuzz.py
           --mylang ./mylang --count 250

  # ---------------------------------------------------------------- #
  # The .myv corruption fuzzer, on BOTH build types on purpose:
  # CLAUDE.md records that a sanitizer build and an assert-free release
  # catch DIFFERENT things here - the debug one finds the memory error,
  # the release one finds the case where a check the debug build relies
  # on has been compiled away.
  # ---------------------------------------------------------------- #
  # ---------------------------------------------------------------- #
  # THE NO-ARENA CONFIGURATION - the JIT with its type tags in
  # REGISTERS instead of imm32.
  #
  # lowmem.h places the Type singletons below 2^31 so a tag store is
  # `mov qword [rbx+d], imm32`. Where that mapping is unavailable -
  # Darwin, Windows, a hardened kernel, an exhausted low 2GB, A FAILED
  # MAP_32BIT ON AN ORDINARY LINUX BOX - store_type_tag and cmp_reg_tag
  # emit a register form instead, and jit_xcache_busy then denies r8 to
  # the pin pool. Materially different emitted code, and it SHIPS.
  #
  # Until MYLANG_NO_LOWMEM existed no build and no lane could enter it,
  # because the arena is an mmap at static init with no switch. That is
  # the lto0 shape: a configuration only one platform can take is a
  # configuration nobody tests. Its first run found a shipped wrong
  # answer - store_dst_bool naming a register for the t_bool tag whose
  # `movabs` had been deleted when the imm32 form landed - with `-rt`
  # 1922/1922 and plain corpus_diff 20/20 throughout.
  #
  # TWO BUILDS, because they catch different things (the myv-fuzz job's
  # reasoning, same file) - and that is MEASURED here, not assumed.
  # Reintroducing the store_dst_bool defect and running `-rt` off-arena
  # in each:
  #     debug-sanitized     rc=134, an ABORT with a located UBSan
  #                         report naming the bad Type access
  #     release-no-asserts  rc=139, a SEGFAULT - the ML_CHECK tripwires
  #                         are compiled away, so the defect arrives as
  #                         the raw crash a user would get, in the build
  #                         configuration a shipped program runs under
  # Neither is redundant: the first says WHERE, the second proves the
  # failure survives without the assertion net holding it up.
  # ---------------------------------------------------------------- #
  nolowmem:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-sanitized
            cmake: -DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
          - name: release-no-asserts
            cmake: -DTESTS=1 -DASSERTS=OFF -DCMAKE_BUILD_TYPE=Release
    name: nolowmem (${{matrix.name}})
    steps:
    - uses: actions/checkout@v4

    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake ${{matrix.cmake}} $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    # ⛔ THE VACUITY GUARD, FIRST. A lane that tests a configuration
    # must PROVE it is in that configuration, or it passes green doing
    # nothing the day a default moves - which is exactly why the lto0
    # lane asserts `lto 0` before it tests anything. Both directions, so
    # neither a stuck-on nor a stuck-off answer gets through.
    - name: "assert the arena is refused (and reported)"
      working-directory: ${{github.workspace}}/build
      run: |
        ./mylang -v | grep -E '^  lowmem +1' \
          || { echo "expected the arena ON by default"; exit 1; }
        MYLANG_NO_LOWMEM=1 ./mylang -v | grep -E '^  lowmem +0' \
          || { echo "MYLANG_NO_LOWMEM=1 did not refuse it"; exit 1; }

    - name: "-rt with the arena refused"
      working-directory: ${{github.workspace}}/build
      run: MYLANG_NO_LOWMEM=1 ./mylang -rt

    # the engine differential in the same configuration: the tree-walker
    # has no JIT, so this is tw vs the register-form emission
    - name: corpus_diff --nolowmem
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang --nolowmem

    - name: driver_checks
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/driver_checks.sh ./mylang

  # ---------------------------------------------------------------- #
  # THE STACK-ALIGNMENT GROUND TRUTH (SP2/SP3). System V requires
  # rsp % 16 == 0 AT the call; the emitter has a MODEL of rsp that says
  # so at emit time, and a model is complete only while every
  # rsp-moving emission goes through one of its seams. This lane emits
  # `test rsp, 15` before every call and reads the REAL rsp, so it
  # needs no model - it is what catches a MISSING seam.
  #
  # TWO BUILDS, and they are not redundant: the FIRST bug it found was
  # invisible to every checked build (-rt 2016/2016, every corpus
  # matrix 35/35, --spcheck itself 35/35 on Debug) and showed only at
  # ASSERTS=0, where the branch-state table it also revives from had
  # been compiled out. Same split as the myv-fuzz lane above.
  # ---------------------------------------------------------------- #
  spcheck:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-sanitized
            cmake: -DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
          - name: release-no-asserts
            cmake: -DTESTS=1 -DASSERTS=OFF -DCMAKE_BUILD_TYPE=Release
    name: spcheck (${{matrix.name}})
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake ${{matrix.cmake}} $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    # THE VACUITY GUARD: the check is emitted code, so prove it is
    # THERE. Its instructions only appear under the lever, so the
    # dump must grow and must carry `test rsp, 15`.
    - name: "assert the alignment check is emitted"
      working-directory: ${{github.workspace}}/build
      run: |
        if ! MYLANG_JIT_SPCHECK=1 ./mylang -vdj \
               $GITHUB_WORKSPACE/samples/gcd | grep -q 'test rsp, 15'
        then echo "the lever emitted no check"; exit 1; fi
        if ./mylang -vdj $GITHUB_WORKSPACE/samples/gcd \
             | grep -q 'test rsp, 15'
        then echo "the check is emitted WITHOUT the lever"; exit 1; fi

    - name: "-rt with the alignment check"
      working-directory: ${{github.workspace}}/build
      run: MYLANG_JIT_SPCHECK=1 ./mylang -rt

    - name: corpus_diff --spcheck
      working-directory: ${{github.workspace}}/build
      run: $GITHUB_WORKSPACE/tests/corpus_diff.sh ./mylang --spcheck

  # ---------------------------------------------------------------- #
  # THE INTRUSIVE TESTS (#107, plans/intrusive-tests.md). An INT_TESTS
  # build runs tests/int_run.py (-rt, every tests/int program under both
  # engines, and the site census: a site no run reached fails). Plus the
  # NON-PERTURBATION check: the INT build must emit byte-identical
  # bytecode and machine code to a plain TESTS build of the same commit -
  # an INT build may cost speed and memory, never a decision.
  # ---------------------------------------------------------------- #
  int:
    runs-on: ubuntu-latest
    env:
      CXX: g++-14        # MC/DC (-fcondition-coverage) needs GCC >= 14
    steps:
    - uses: actions/checkout@v4
    - name: Install GCC 14
      run: sudo apt-get update && sudo apt-get install -y g++-14
    - name: Build (INT_TESTS + GCOV)
      run: |
        cmake -S $GITHUB_WORKSPACE -B build-int -DINT_TESTS=ON -DGCOV=ON \
              -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-int -j
    - name: Build (TESTS, the reference)
      run: |
        cmake -S $GITHUB_WORKSPACE -B build-tests -DTESTS=1 \
              -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug
        cmake --build build-tests -j

    # THE VACUITY GUARD: both answers, both directions.
    - name: "assert -v reports int_tests 1 / 0"
      run: |
        ./build-int/mylang -v | grep -q '^  int_tests  *1'
        ./build-tests/mylang -v | grep -q '^  int_tests  *0'

    - name: "non-perturbation: INT emits what TESTS emits"
      run: scripts/vdjcmp.sh ./build-tests/mylang ./build-int/mylang

    # The suite, the site census and the coverage universe in ONE pass:
    # every unit must own an element, and the uncovered count may not
    # exceed this compiler's line in tests/int/coverage-floor.txt.
    - name: tests/int_run.py --gcov
      run: |
        tests/int_run.py ./build-int/mylang --gcov --require-floor \
                         --report int-coverage.txt
    - name: Upload the coverage report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: int-coverage
        path: int-coverage.txt

    - name: driver_checks
      run: MYLANG_EXPECT_INT_TESTS=1 sh tests/driver_checks.sh ./build-int/mylang

  # ---------------------------------------------------------------- #
  # The #107 P3 DECISION ENUMERATOR, tier 1: every legal alternative of
  # every register pick a default run makes, over tests/functional,
  # against the tree-walker. Correctness must not depend on which legal
  # register the allocator picks - its first run found five JIT bugs no
  # default pick reaches. The FAST lane (optimized, ASSERTS on so the
  # REGTRACK net and the ML_CHECKs stay live, LTO off for the build
  # time): ~40 s locally for the whole corpus.
  # ---------------------------------------------------------------- #
  int-enum:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build (INT_TESTS, optimized, asserts on)
      run: |
        cmake -S $GITHUB_WORKSPACE -B build-enum -DINT_TESTS=ON \
              -DCMAKE_BUILD_TYPE=Release -DASSERTS=ON -DLTO=OFF
        cmake --build build-enum -j
    # THE VACUITY GUARD: an enumerator run on a build without the hooks
    # (or without the tracker) would answer "0 failures" doing nothing
    - name: "assert -v reports int_tests 1, asserts 1"
      run: |
        ./build-enum/mylang -v | grep -q '^  int_tests  *1'
        ./build-enum/mylang -v | grep -q '^  asserts  *1'
    # tests/functional plus samples/ - minus phonebook and shopping
    # (stdin-driven: with no input they reach no decision) and rand_sort
    # (its output is random). bench/ is NOT a correctness corpus.
    - name: tests/int_enum.py (tier 1, tests/functional + samples)
      run: |
        python3 tests/int_enum.py ./build-enum/mylang --heartbeat 60 \
                --failures-out int-enum-failures.txt \
                tests/functional/*.my samples/fib samples/gcd samples/loop \
                samples/primes samples/primes2 samples/strloop
    # tier 2: TWO decisions at once, every combination, in each SMALL
    # scope (one JIT run's choices, one caller's inlining sites) - ~3k
    # runs. Tier 3 (the pairwise covering arrays of the larger scopes,
    # ~110k runs) is on demand: .github/workflows/int-deep.yml.
    - name: tests/int_enum.py (tier 2, the same corpus)
      run: |
        python3 tests/int_enum.py ./build-enum/mylang --tier 2 \
                --heartbeat 60 --failures-out int-enum-failures-t2.txt \
                tests/functional/*.my samples/fib samples/gcd samples/loop \
                samples/primes samples/primes2 samples/strloop
    # disasmcheck (-vdj vs objdump, every operand) in configurations no
    # matrix axis reaches: forced allocator picks that put a float stage
    # in xmm8-15 and a GP scratch/pin in r8/r15 - the REX.R/X/B forms a
    # decoder can drop and still print the right mnemonic. The keys name
    # 59_float_abi_calls' two runs; the guard first proves each still
    # lands in r8-r15 / xmm8-15, so a key the program drifted away from
    # fails here instead of checking the default registers again.
    - name: disasmcheck, forced picks into the REX registers
      run: |
        P=tests/functional/59_float_abi_calls.my
        C1='main@0/fp#0=11,main@21/fp#0=11'
        C2='main@0/fp#1=9,main@21/fp#1=9'
        C3='main@0/gp#5=4,main@21/gp#2=9'
        for c in "$C1" "$C2" "$C3"; do
          rm -f pick.txt
          MYLANG_INT_CHOOSE="$c" MYLANG_INT_DUMP=pick.txt \
            ./build-enum/mylang $P > /dev/null
          n=$(grep -E '^choose_reg .* reg=(8|9|1[0-5])$' pick.txt \
              | grep -o 'key="[^"]*"' | sort -u | wc -l)
          if [ "$n" -ne 2 ]; then
            echo "forced picks $c no longer land in r8-r15/xmm8-15:"
            grep '^choose_' pick.txt
            exit 1
          fi
        done
        python3 scripts/disasmcheck.py ./build-enum/mylang \
                --only tests/functional \
                --env "MYLANG_INT_CHOOSE=$C1" \
                --env "MYLANG_INT_CHOOSE=$C2" \
                --env "MYLANG_INT_CHOOSE=$C3"
    - name: Upload the failures
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: int-enum-failures
        path: int-enum-failures*.txt
        if-no-files-found: ignore

  myv-fuzz:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: debug-asan
            flags: "-DTESTS=1 -DVM_HARDENING=ON -DCMAKE_BUILD_TYPE=Debug"
          - name: release-noassert
            flags: "-DTESTS=1 -DASSERTS=OFF -DCMAKE_BUILD_TYPE=Release"
    name: "myv-fuzz (${{ matrix.name }})"
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake ${{ matrix.flags }} $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j

    - name: myv_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/myv_fuzz.py ./mylang -n 400
           --save $GITHUB_WORKSPACE/myv-fuzz-bad

    # a finding cannot be regenerated from a seed - an image embeds its
    # source path - so keep it
    - name: Upload findings
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: myv-fuzz-bad-${{ matrix.name }}
        path: myv-fuzz-bad/
        if-no-files-found: ignore

  # ---------------------------------------------------------------- #
  # The REPL fuzzer under RECYCLE=1 + ASan, which is the combination
  # CLAUDE.md names for this: the REPL RETAINS its input ASTs, so it is
  # where a stale-node identity bug would live, and the recycling
  # allocator is what makes that class deterministic.
  # ---------------------------------------------------------------- #
  repl-fuzz:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DRECYCLE=ON -DVM_HARDENING=ON
           -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j
    - name: repl_fuzz
      working-directory: ${{github.workspace}}/build
      run: python3 $GITHUB_WORKSPACE/tests/repl_fuzz.py ./mylang -n 400
           --save $GITHUB_WORKSPACE/repl-fuzz-bad
    - name: Upload findings
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: repl-fuzz-bad
        path: repl-fuzz-bad/
        if-no-files-found: ignore

  # ---------------------------------------------------------------- #
  # Net 4: the coverage RATCHET over the no-record tier's walk and
  # reconstruction surface.
  #
  # The floors below are NOT the goal - the goal is 100% (--gate), and
  # docs/jit-optimizations.md's Net 4 entry records what is still
  # uncovered and why. They exist so the surface can only improve: a
  # plain `-rt` alone measures 54.8%/47.0% here, so a change that
  # stopped the shadow workload from running would fall straight
  # through these floors even though the absolute target is ahead.
  # ---------------------------------------------------------------- #
  coverage-gate:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Configure
      run: cmake -E make_directory ${{github.workspace}}/build
    - name: CMake
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DGCOV=1 -DVM_HARDENING=ON
           -DCMAKE_BUILD_TYPE=Debug $GITHUB_WORKSPACE
    - name: Build
      working-directory: ${{github.workspace}}/build
      run: cmake --build . -j
    - name: "Net 4: no-record coverage ratchet"
      run: python3 $GITHUB_WORKSPACE/tests/norec_coverage.py
           --build-dir ${{github.workspace}}/build --run
           --min-lines 70 --min-branches 55
