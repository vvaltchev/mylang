name: Coverage
on: [pull_request, push, workflow_dispatch]

env:
  BUILD_TYPE: Debug

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Compiler and test diagnostics as annotations
      run: echo "::add-matcher::.github/problem-matchers.json"

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      # VM_HARDENING=ON: the heavy per-op VM checks (on by default for a Debug
      # build; pinned explicitly for parity with the other lanes).
      run: cmake -DTESTS=1 -DGCOV=1 -DVM_HARDENING=ON $GITHUB_WORKSPACE
           -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    - name: Test
      shell: bash
      run: tests/run -o --logs test-logs --bin cmake-gcov=build/mylang
           rt@cmake-gcov

    - name: Upload coverage data
      working-directory: ${{github.workspace}}/build
      shell: bash
      run:  bash <(curl -s https://codecov.io/bash)

    - name: Upload the test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{github.job}}-${{strategy.job-index}}
        path: test-logs/
        if-no-files-found: ignore
