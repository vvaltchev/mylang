name: Windows
on: [pull_request, push, workflow_dispatch]

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest]
        bt: [Debug, Release]
        include:          # the tests/run build each one stands for
          - bt: Debug
            lane: dbg
          - bt: Release
            lane: rel-hard

    env:
      BUILD_TYPE: ${{ matrix.bt }}

    steps:
    - uses: actions/checkout@v4
    - name: Compiler and test diagnostics as annotations
      run: echo "::add-matcher::.github/problem-matchers.json"

    - name: Create Build Environment
      run: cmake -E make_directory ${{github.workspace}}/build

    # VM_HARDENING=ON: the heavy per-op VM checks (frame-slot bounds + operand
    # type tags) in BOTH the Debug and Release lanes - so the Windows Release
    # lane (where a layout-dependent VM UB has crashed) turns it into a loud,
    # located assertion instead of a mystery access violation.
    - name: Configure CMake
      shell: bash
      working-directory: ${{github.workspace}}/build
      run: cmake -DTESTS=1 -DVM_HARDENING=ON $GITHUB_WORKSPACE
           -DCMAKE_BUILD_TYPE=$BUILD_TYPE

    - name: Build
      working-directory: ${{github.workspace}}/build
      shell: bash
      run: cmake --build . --config $BUILD_TYPE

    # The binary stands for tests/run's `dbg` / `rel-hard` build and is
    # checked against it first (MSVC sets no optimization macro, so the
    # debug one reports `opt unknown`, which `dbg` accepts). No live
    # progress socket here (no Unix sockets); the heartbeat lines print.
    - name: Test
      shell: bash
      run: python tests/run -o --logs test-logs
           --bin ${{ matrix.lane }}=build/${{ matrix.bt }}/mylang.exe
           rt@${{ matrix.lane }}

    - name: Upload the test logs
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: test-logs-${{github.job}}-${{strategy.job-index}}
        path: test-logs/
        if-no-files-found: ignore

